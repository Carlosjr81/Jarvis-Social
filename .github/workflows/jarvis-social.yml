# Jarvis Social: testes em todo push/PR e implantação do servidor
# (Supabase) quando os segredos existirem.
name: Jarvis Social

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      implantar:
        description: "Implantar o servidor (Supabase) depois dos testes"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: jarvis-social-${{ github.ref }}
  cancel-in-progress: false

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      # A suíte SQL sobe um PostgreSQL temporário e a do painel abre o
      # Chromium em tela de celular. No Actions os dois são obrigatórios
      # (JS_EXIGIR_TUDO): faltar não pode virar "passou sem testar".
      - name: PostgreSQL e Chromium
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql > /dev/null
          npm install --no-save --silent playwright@1.49.1
          npx playwright install --with-deps chromium > /dev/null
      - name: Testes (núcleo, API, worker, SQL, painel)
        env:
          JS_EXIGIR_TUDO: "1"
        run: node testes/rodar.mjs

  implantar:
    needs: testes
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.implantar)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # O ÚNICO segredo obrigatório. O resto o workflow descobre ou gera.
      SUPABASE_ACCESS_TOKEN: ${{ secrets.JS_SUPABASE_ACCESS_TOKEN }}
      EMAIL_DONO: ${{ secrets.JS_EMAIL_DONO }}          # opcional: sem ele, a 1ª conta confirmada vira dona
      REF_FIXO: ${{ secrets.JS_SUPABASE_PROJECT_REF }}  # opcional: usar um projeto já existente
      META_APP_ID: ${{ secrets.JS_META_APP_ID }}        # opcional: o app da Meta também se configura pelo painel
      META_APP_SECRET: ${{ secrets.JS_META_APP_SECRET }}
      PAINEL: https://carlosjr81.github.io/Jarvis-Social/
      API: https://api.supabase.com/v1
    steps:
      - name: Segredo presente?
        id: seg
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::Implantação pulada: falta o segredo JS_SUPABASE_ACCESS_TOKEN (veja docs/DEPLOY.md)."
            echo "ok=0" >> "$GITHUB_OUTPUT"
          else echo "ok=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v5
        if: steps.seg.outputs.ok == '1'
      - uses: supabase/setup-cli@v1
        if: steps.seg.outputs.ok == '1'
        with:
          version: latest
      - name: Projeto (acha o "jarvis-social" ou cria um grátis em São Paulo)
        if: steps.seg.outputs.ok == '1'
        run: |
          H=(-H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json")
          REF="$REF_FIXO"
          if [ -z "$REF" ]; then REF=$(curl -fsS "${H[@]}" "$API/projects" | jq -r '[.[] | select(.name=="jarvis-social")][0].id // empty'); fi
          if [ -z "$REF" ]; then
            ORG=$(curl -fsS "${H[@]}" "$API/organizations" | jq -r '.[0].id')
            SENHA=$(openssl rand -hex 24)   # a senha do banco não é usada depois (tudo vai pela API)
            jq -n --arg o "$ORG" --arg s "$SENHA" '{name:"jarvis-social", organization_id:$o, db_pass:$s, region:"sa-east-1"}' > /tmp/p.json
            REF=$(curl -fsS -X POST "${H[@]}" "$API/projects" --data @/tmp/p.json | jq -r '.id')
            echo "Projeto criado: $REF"
          fi
          test -n "$REF" && test "$REF" != "null"
          for i in $(seq 1 60); do
            ST=$(curl -fsS "${H[@]}" "$API/projects/$REF" | jq -r '.status')
            [ "$ST" = "ACTIVE_HEALTHY" ] && break; echo "aguardando o projeto ($ST)…"; sleep 10
          done
          echo "REF=$REF" >> "$GITHUB_ENV"
      - name: Banco (migrations pela API, sem senha do banco)
        if: steps.seg.outputs.ok == '1'
        run: |
          sql() { jq -n --arg q "$1" '{query:$q}' > /tmp/q.json; curl -fsS -X POST -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" "$API/projects/$REF/database/query" --data @/tmp/q.json; }
          sql "create table if not exists jarvis_migracoes (nome text primary key, aplicado_em timestamptz not null default now()); alter table jarvis_migracoes enable row level security;" > /dev/null
          for f in $(ls supabase/migrations/*.sql | sort); do
            n=$(basename "$f")
            ja=$(sql "select count(*)::int as n from jarvis_migracoes where nome = '$n'" | jq -r '.[0].n')
            if [ "$ja" = "0" ]; then
              echo "aplicando $n"
              sql "begin; $(cat "$f"); insert into jarvis_migracoes(nome) values ('$n'); commit;" > /dev/null
            fi
          done
          echo "SQL_OK=1" >> "$GITHUB_ENV"
      - name: Segredos do servidor (gerados aqui; nada para o dono guardar)
        if: steps.seg.outputs.ok == '1'
        run: |
          WORKER=$(printf 'jarvis-social-worker:%s:%s' "$REF" "$SUPABASE_ACCESS_TOKEN" | sha256sum | cut -c1-48)
          echo "::add-mask::$WORKER"; echo "WORKER=$WORKER" >> "$GITHUB_ENV"
          ARGS=(JS_SEGREDO_WORKER="$WORKER" JS_URL_PAINEL="$PAINEL" JS_ORIGENS_PERMITIDAS="https://carlosjr81.github.io")
          # A chave de cifra dos tokens do Instagram nasce uma vez e nunca é trocada aqui.
          if ! supabase secrets list --project-ref "$REF" 2>/dev/null | grep -q JS_CHAVE_CIFRA; then
            CIFRA=$(openssl rand -base64 32); echo "::add-mask::$CIFRA"; ARGS+=(JS_CHAVE_CIFRA="$CIFRA")
          fi
          [ -n "$EMAIL_DONO" ] && ARGS+=(JS_EMAIL_DONO="$EMAIL_DONO")
          [ -n "$META_APP_ID" ] && ARGS+=(JS_META_APP_ID="$META_APP_ID")
          [ -n "$META_APP_SECRET" ] && ARGS+=(JS_META_APP_SECRET="$META_APP_SECRET")
          supabase secrets set --yes --project-ref "$REF" "${ARGS[@]}"
      - name: Funções (api, worker e conector MCP)
        if: steps.seg.outputs.ok == '1'
        run: supabase functions deploy api worker mcp --project-ref "$REF" --use-api --yes
      - name: Relógio do worker (pg_cron, a cada minuto) e login (URL do painel)
        if: steps.seg.outputs.ok == '1'
        run: |
          URL="https://$REF.supabase.co"
          SQL=$(sed -e "s#__URL__#$URL#" -e "s#__SEGREDO__#$WORKER#" supabase/agendar-worker.sql)
          jq -n --arg q "$SQL" '{query:$q}' > /tmp/q.json
          curl -fsS -X POST "$API/projects/$REF/database/query" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/q.json > /dev/null
          jq -n --arg s "$PAINEL" --arg c "$URL/functions/v1/api/confirmado" '{site_url:$s, uri_allow_list:($s + "," + $c)}' > /tmp/a.json
          curl -fsS -X PATCH "$API/projects/$REF/config/auth" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/a.json > /dev/null
          # (Modelos de e-mail em português exigem SMTP próprio no plano grátis: ficam os padrões.)
      - name: Prova de vida (saúde da API, worker e conector)
        if: steps.seg.outputs.ok == '1'
        run: |
          URL="https://$REF.supabase.co"
          curl -fsS "$URL/functions/v1/api/v1/saude"; echo
          curl -fsS -X POST "$URL/functions/v1/worker" -H "x-jarvis-worker: $WORKER" | head -c 400; echo
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST "$URL/functions/v1/mcp/js_000000000000000000000000000000000000000000000000" -d '{}')" = "401"
          echo "Painel: $PAINEL"; echo "Conector MCP: $URL/functions/v1/mcp/<chave criada no painel>"
      - name: Endereço público no painel e no contrato do GPT
        if: steps.seg.outputs.ok == '1'
        run: |
          ANON=$(curl -fsS "$API/projects/$REF/api-keys" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" | jq -r '[.[] | select(.name=="anon")][0].api_key')
          test -n "$ANON" && test "$ANON" != "null"
          cat > config.js <<EOF2
          // Endereços PÚBLICOS do servidor (gerado pelo workflow Jarvis Social).
          // A chave "anon" é pública por natureza; segredos ficam só no Supabase.
          export const CONFIG = {
            supabaseUrl: "https://$REF.supabase.co",
            supabaseAnon: "$ANON",
          };
          EOF2
          sed -i "s#https://SEU_REF.supabase.co#https://$REF.supabase.co#" openapi-chatgpt.json
          if ! git diff --quiet config.js openapi-chatgpt.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add config.js openapi-chatgpt.json
            git commit -m "Jarvis Social: endereço do servidor no painel e no contrato do GPT"
            git push
          fi
