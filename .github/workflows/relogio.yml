# Relógio RESERVA do worker do Jarvis Social. O principal é o pg_cron no
# Supabase (a cada minuto). O cron do Actions pode atrasar ou ser descartado
# em horário de pico (documentação do GitHub), por isso NÃO é o mecanismo
# principal: só garante que, se o pg_cron parar, a fila ainda anda.
name: Jarvis Social - relógio reserva

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write   # para disparar a instalação sozinho quando o token aparecer

jobs:
  bater:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      TOKEN: ${{ secrets.JS_SUPABASE_ACCESS_TOKEN }}
      REF_FIXO: ${{ secrets.JS_SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: config.js
          sparse-checkout-cone-mode: false
      # O dono só cola o token no GitHub; a instalação começa sozinha aqui.
      - name: Instalar o servidor se o token chegou e o painel ainda não aponta para ele
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$TOKEN" ]; then echo "Sem token do Supabase ainda."; exit 0; fi
          if grep -Eq 'supabaseUrl: *"https://' config.js; then echo "Servidor já instalado."; exit 0; fi
          ANDAMENTO=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO/actions/workflows/jarvis-social.yml/runs?per_page=5" | jq '[.workflow_runs[] | select(.status != "completed")] | length')
          if [ "$ANDAMENTO" != "0" ]; then echo "Instalação já em andamento."; exit 0; fi
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/workflows/jarvis-social.yml/dispatches" -d '{"ref":"main","inputs":{"implantar":true}}'
          echo "Token encontrado: instalação do servidor disparada."
      - name: Chamar o worker
        run: |
          if [ -z "$TOKEN" ]; then echo "Servidor ainda não configurado."; exit 0; fi
          REF="$REF_FIXO"
          [ -z "$REF" ] && REF=$(curl -fsS -H "Authorization: Bearer $TOKEN" https://api.supabase.com/v1/projects | jq -r '[.[] | select(.name=="jarvis-social")][0].id // empty')
          [ -z "$REF" ] && { echo "Projeto ainda não existe."; exit 0; }
          WORKER=$(printf 'jarvis-social-worker:%s:%s' "$REF" "$TOKEN" | sha256sum | cut -c1-48)
          echo "::add-mask::$WORKER"
          curl -fsS -m 90 -X POST "https://$REF.supabase.co/functions/v1/worker" -H "x-jarvis-worker: $WORKER" | head -c 600; echo
