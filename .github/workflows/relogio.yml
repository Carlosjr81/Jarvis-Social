# Relógio RESERVA do worker do Jarvis Social. O principal é o pg_cron no
# Supabase (a cada minuto). O cron do Actions pode atrasar ou ser descartado
# em horário de pico (documentação do GitHub), por isso NÃO é o mecanismo
# principal: só garante que, se o pg_cron parar, a fila ainda anda.
name: Jarvis Social - relógio reserva

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bater:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      TOKEN: ${{ secrets.JS_SUPABASE_ACCESS_TOKEN }}
      REF_FIXO: ${{ secrets.JS_SUPABASE_PROJECT_REF }}
    steps:
      - name: Chamar o worker
        run: |
          if [ -z "$TOKEN" ]; then echo "Servidor ainda não configurado."; exit 0; fi
          REF="$REF_FIXO"
          [ -z "$REF" ] && REF=$(curl -fsS -H "Authorization: Bearer $TOKEN" https://api.supabase.com/v1/projects | jq -r '[.[] | select(.name=="jarvis-social")][0].id // empty')
          [ -z "$REF" ] && { echo "Projeto ainda não existe."; exit 0; }
          WORKER=$(printf 'jarvis-social-worker:%s:%s' "$REF" "$TOKEN" | sha256sum | cut -c1-48)
          echo "::add-mask::$WORKER"
          curl -fsS -m 90 -X POST "https://$REF.supabase.co/functions/v1/worker" -H "x-jarvis-worker: $WORKER" | head -c 600; echo
